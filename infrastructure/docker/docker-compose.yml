services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aeronexis-network

  mongodb:
    image: mongo:6
    container_name: erp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - aeronexis-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - aeronexis-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - aeronexis-network

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    container_name: erp-api-gateway
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
      - production-service
      - logistics-service
      - sales-service
      - notification-service
    networks:
      - aeronexis-network

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    container_name: erp-auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_SCHEMA: auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: 10
      DEFAULT_ADMIN_PWD: ${DEFAULT_ADMIN_PWD}
      DEFAULT_OPERATOR_PWD: ${DEFAULT_OPERATOR_PWD}
      DEFAULT_LOGISTICS_PWD: ${DEFAULT_LOGISTICS_PWD}
      DEFAULT_SALES_PWD: ${DEFAULT_SALES_PWD}
      PORT: 3001
    depends_on:
      - postgres
    networks:
      - aeronexis-network

  production-service:
    build:
      context: ../../
      dockerfile: services/production-service/Dockerfile
    container_name: erp-production-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_SCHEMA: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PORT: 3002
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - aeronexis-network

  logistics-service:
    build:
      context: ../../
      dockerfile: services/logistics-service/Dockerfile
    container_name: erp-logistics-service
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_SCHEMA: logistics
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PORT: 3003
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - aeronexis-network

  sales-service:
    build:
      context: ../../
      dockerfile: services/sales-service/Dockerfile
    container_name: erp-sales-service
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_SCHEMA: sales
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PORT: 3004
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - aeronexis-network

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Dockerfile
    container_name: erp-notification-service
    ports:
      - "3006:3006"
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      PORT: 3006
    depends_on:
      - rabbitmq
      - redis
    networks:
      - aeronexis-network

  traceability-service:
    build:
      context: ../../
      dockerfile: services/traceability-service/Dockerfile
    container_name: erp-traceability-service
    ports:
      - "3005:3005"
    environment:
      MONGO_URI: mongodb://mongodb:27017/${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PORT: 3005
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - aeronexis-network

volumes:
  pgdata:
  mongodata:
  rabbitmqdata:
  redisdata:

networks:
  aeronexis-network:
    driver: bridge
