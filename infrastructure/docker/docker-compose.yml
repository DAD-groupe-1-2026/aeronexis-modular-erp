services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aeronexis_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aeronexis-network

  mongodb:
    image: mongo:6
    container_name: erp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - aeronexis-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - aeronexis-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - aeronexis-network

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    container_name: erp-api-gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - production-service
    networks:
      - aeronexis-network

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    container_name: erp-auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeronexis_db
      DB_SCHEMA: auth
      JWT_SECRET: changeme-in-production
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: 10
      PORT: 3001
    depends_on:
      - postgres
    networks:
      - aeronexis-network

  production-service:
    build:
      context: ../../
      dockerfile: services/production-service/Dockerfile
    container_name: erp-production-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeronexis_db
      DB_SCHEMA: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3002
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - aeronexis-network

# Déclaration des volumes gérés par Docker Compose
volumes:
  pgdata:      # <-- Notez que "external: true" a disparu
  mongodata:
  rabbitmqdata:
  redisdata:

networks:
  aeronexis-network:
    driver: bridge