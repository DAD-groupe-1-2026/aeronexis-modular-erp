worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Upstreams (Couche 4 — microservices) ──────────────────────────────────
    upstream auth_service {
        server auth-service:3001;
    }

    upstream production_service {
        server production-service:3002;
    }

    upstream logistics_service {
        server logistics-service:3003;
    }

    upstream sales_service {
        server sales-service:3004;
    }

    # Services non implémentés (commentés pour éviter les erreurs de résolution DNS)
    upstream traceability_service {
        server traceability-service:3005;
    }
    upstream notification_service {
        server notification-service:3006;
    }

    # ─── Serveur principal — Façade unique ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Headers transmis à tous les services en aval
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        # Timeout
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        # ── Route publique : login (pas de vérification JWT) ──
        location /auth/ {
            proxy_pass http://auth_service;
        }

        # ── Routes protégées : vérification JWT via auth_request ─────────────
        location = /_jwt_verify {
            internal;
            proxy_pass              http://auth_service/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length  "";
            proxy_set_header        Authorization   $http_authorization;
        }

        location /api/production/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            auth_request /_jwt_verify;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_set_header X-User $auth_user;
            proxy_pass http://production_service;
        }

        location /api/logistics/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            auth_request /_jwt_verify;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_set_header X-User $auth_user;
            proxy_pass http://logistics_service;
        }

        location /api/sales/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            auth_request /_jwt_verify;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_set_header X-User $auth_user;
            proxy_pass http://sales_service;
        }

        location /api/traceability/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            auth_request /_jwt_verify;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_set_header X-User $auth_user;
            proxy_pass http://traceability_service;
        }

        location /api/notifications/ {
            auth_request /_jwt_verify;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_set_header X-User $auth_user;
            proxy_pass http://notification_service;
        }

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://notification_service;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Façade UI — applications front-end (production : assets statiques) ──
        location /production/ {
            root /usr/share/nginx;
            try_files $uri $uri/ /production/index.html;
        }

        location /logistics/ {
            root /usr/share/nginx;
            try_files $uri $uri/ /logistics/index.html;
        }

        location / {
            root /usr/share/nginx/portal;
            try_files $uri $uri/ /index.html;
        }

        # ── Erreurs normalisées au format { status, data, error } ──────────────
        error_page 401 = @unauthorized;
        error_page 502 503 504 = @gateway_error;

        location @unauthorized {
            default_type application/json;
            return 401 '{"status":"failure","data":null,"error":{"code":"UNAUTHORIZED","message":"Token manquant ou invalide"}}';
        }

        location @gateway_error {
            default_type application/json;
            return 502 '{"status":"failure","data":null,"error":{"code":"GATEWAY_ERROR","message":"Service temporairement indisponible"}}';
        }
    }
}
